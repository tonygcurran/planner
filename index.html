/* ===================== linked sources ===================== */
function normUrl(u) {
  u = (u || '').trim();
  if (!u) return '';
  return /^https?:\/\//i.test(u) ? u : 'https://' + u;
}
function ytId(url) {
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function hostOf(url) {
  try { return new URL(normUrl(url)).hostname.replace(/^www\./, ''); }
  catch (e) { return ''; }
}
function sourceKind(url) {
  const h = hostOf(url);
  if (ytId(url)) return { k: 'video', label: 'YouTube', hex: '#C0392B' };
  if (/vimeo\.com/.test(h)) return { k: 'video', label: 'Vimeo', hex: '#1E96A8' };
  if (/(doi\.org|jstor|tandfonline|sciencedirect|springer|academia\.edu|researchgate|scholar\.google)/.test(h))
    return { k: 'paper', label: 'Paper', hex: '#5A4FB0' };
  if (/(instagram|vsco|behance|artsy|saatchi)/.test(h)) return { k: 'image', label: 'Images', hex: '#C6337E' };
  if (/(podcasts\.apple|spotify|soundcloud)/.test(h)) return { k: 'audio', label: 'Audio', hex: '#D9A400' };
  return { k: 'page', label: h || 'Link', hex: '#71716D' };
}
function autoLabel(url) {
  const h = hostOf(url);
  try {
    const p = new URL(normUrl(url)).pathname.split('/').filter(Boolean).pop() || '';
    const t = decodeURIComponent(p).replace(/[-_+]/g, ' ').replace(/\.\w{2,4}$/, '').trim();
    if (t && t.length > 3 && !/^[\w-]{11}$/.test(t)) return t.charAt(0).toUpperCase() + t.slice(1);
  } catch (e) {}
  return h;
}

/* arr: [{id,label,url,note}] */
function linkList(arr, redraw, opts) {
  opts = opts || {};
  const box = E('div');
  (arr || []).forEach((l, i) => {
    const src = sourceKind(l.url), id = ytId(l.url);
    const row = E('div', { style: 'padding:11px 0;border-top:1px solid var(--rule)' });
    row.append(E('div', { style: 'display:flex;gap:10px;align-items:flex-start' }, [
      id ? E('img', { src: 'https://img.youtube.com/vi/' + id + '/mqdefault.jpg', loading: 'lazy',
              style: 'width:64px;height:36px;object-fit:cover;border-radius:2px;flex:none;background:var(--paper)' })
         : E('span', { style: `width:4px;align-self:stretch;min-height:34px;border-radius:2px;background:${src.hex};flex:none` }),
      E('div', { style: 'flex:1;min-width:0' }, [
        l.url
          ? E('a', { href: normUrl(l.url), target: '_blank', rel: 'noopener noreferrer',
              style: 'font-size:14.5px;color:var(--ink);text-decoration:none;display:block;font-weight:600',
              text: l.label || autoLabel(l.url) })
          : E('span', { style: 'font-size:14.5px;font-weight:600', text: l.label || 'Untitled source' }),
        E('div', { style: 'display:flex;gap:7px;align-items:center;margin-top:3px;flex-wrap:wrap' }, [
          E('span', { cls: 'tag', style: `border-color:${src.hex}55;color:${src.hex}`, text: src.label }),
          E('span', { cls: 'pct', style: 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px', text: hostOf(l.url) })
        ])
      ]),
      E('button', { cls: 'x', text: '×', 'aria-label': 'Remove source',
        onclick: () => { arr.splice(i, 1); save(); redraw(); } })
    ]));
    if (!opts.compact) {
      const ta = E('textarea', { rows: 1, placeholder: 'Why this matters — a line for later',
        style: 'font-size:14px;margin-top:6px',
        oninput: ev => { grow(ev.target); l.note = ev.target.value; save(); } });
      ta.value = l.note || '';
      requestAnimationFrame(() => grow(ta));
      row.append(ta);
    }
    box.append(row);
  });

  const urlIn = E('input', { type: 'text', placeholder: 'Paste a link', inputmode: 'url', autocapitalize: 'off' });
  const labIn = E('input', { type: 'text', placeholder: 'Label (optional)' });
  const add = () => {
    const u = normUrl(urlIn.value);
    if (!u && !labIn.value.trim()) { toast('Nothing to add'); return; }
    arr.push({ id: uid(), url: u, label: labIn.value.trim() || (u ? autoLabel(u) : 'Untitled source'), note: '' });
    save(); redraw();
  };
  urlIn.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  box.append(E('div', { style: 'margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center' }, [
    E('div', { style: 'flex:2;min-width:150px' }, urlIn),
    E('div', { style: 'flex:1.2;min-width:110px' }, labIn),
    E('button', { cls: 'btn', text: 'Add', onclick: add })
  ]));
  if (!(arr || []).length) box.insertBefore(E('div', { cls: 'empty', text: opts.empty || 'No sources linked yet.' }), box.firstChild);
  return box;
}

/* every link in the planner, gathered */
function allSources() {
  const out = [];
  const push = (l, where, ctx) => out.push({ l, where, ctx });
  (S.links || []).forEach(l => push(l, 'Library', ''));
  S.studio.entries.forEach(e => (e.links || []).forEach(l => push(l, 'Studio', e.title || e.date)));
  S.goals.forEach(g => (g.links || []).forEach(l => push(l, 'Goal', g.title || 'Untitled goal')));
  S.notes.forEach(n => (n.links || []).forEach(l => push(l, 'Note', n.title || 'Untitled note')));
  return out;
}

function pageSources() {
  const v = E('div');
  v.append(backBar('Sources'));
  v.append(E('p', { cls: 'lede', text: 'Articles, videos, papers and pages — kept loose here, or attached to a session, a goal or a note where they belong.' }));

  const c = E('div', { cls: 'card on' });
  c.append(E('h2', { text: 'Library' }));
  S.links = S.links || [];
  c.append(linkList(S.links, render, { empty: 'Nothing here yet. Paste a link and it works out what kind of thing it is.' }));
  v.append(c);

  const attached = allSources().filter(s => s.where !== 'Library');
  if (attached.length) {
    const ac = E('div', { cls: 'card' });
    ac.append(E('h2', { text: 'Attached elsewhere' }));
    attached.forEach(s => {
      const src = sourceKind(s.l.url);
      ac.append(E('div', { cls: 'list-item' }, [
        E('span', { style: `width:4px;align-self:stretch;border-radius:2px;background:${src.hex};flex:none` }),
        E('div', { cls: 'txt' }, [
          s.l.url
            ? E('a', { href: normUrl(s.l.url), target: '_blank', rel: 'noopener noreferrer',
                style: 'font-size:14px;color:var(--ink);text-decoration:none', text: s.l.label || autoLabel(s.l.url) })
            : E('span', { style: 'font-size:14px', text: s.l.label }),
          E('div', { cls: 'pct', text: s.where + ' · ' + s.ctx })
        ])
      ]));
    });
    v.append(ac);
  }
  return v;
}


/* ===================== anchoring the day's intention ===================== */
/* an anchor is {k:'p'|'g'|'m', id, gid} — a practice, a goal, or a milestone */

function anchorOptions() {
  const groups = [];
  const pr = { label: 'Practice', items: [] };
  LIMBS.forEach(l => l.practices.forEach(p => pr.items.push({
    v: 'p:' + p.id, t: l.sanskrit + ' · ' + p.name.replace(/ ·.*$/, '')
  })));
  groups.push(pr);
  const open = S.goals.filter(g => !g.completed);
  if (open.length) {
    groups.push({ label: 'Goals', items: open.map(g => ({ v: 'g:' + g.id, t: g.title || 'Untitled goal' })) });
    const ms = [];
    open.forEach(g => (g.milestones || []).forEach(m => {
      if (m.d) return;
      if (!m.id) m.id = uid();
      ms.push({ v: 'm:' + g.id + ':' + m.id, t: (m.t || 'Milestone') + ' — ' + (g.title || 'goal') });
    }));
    if (ms.length) groups.push({ label: 'Milestones', items: ms });
  }
  return groups;
}
function parseAnchor(v) {
  if (!v) return null;
  const b = v.split(':');
  if (b[0] === 'p') return { k: 'p', id: b[1] };
  if (b[0] === 'g') return { k: 'g', id: b[1] };
  if (b[0] === 'm') return { k: 'm', gid: b[1], id: b[2] };
  return null;
}
function anchorValue(a) {
  if (!a) return '';
  return a.k === 'm' ? 'm:' + a.gid + ':' + a.id : a.k + ':' + a.id;
}
function anchorInfo(a) {
  if (!a) return null;
  if (a.k === 'c') return { label: a.label, sub: 'Your own anchor', hex: 'hsl(var(--hue),68%,44%)' };
  if (a.k === 'p') {
    const p = PBYID[a.id];
    if (!p) return null;
    return { label: p.limb.sanskrit + ' · ' + p.name.replace(/^[^·]*· /, ''), sub: p.prompt, hex: p.limb.hue, practice: p };
  }
  if (a.k === 'g') {
    const g = S.goals.find(x => x.id === a.id);
    if (!g) return null;
    return { label: g.title || 'Untitled goal', sub: goalProgress(g) + '% complete', hex: 'hsl(var(--hue),68%,44%)', goal: g };
  }
  if (a.k === 'm') {
    const g = S.goals.find(x => x.id === a.gid);
    const m = g && (g.milestones || []).find(x => x.id === a.id);
    if (!m) return null;
    return { label: m.t || 'Milestone', sub: 'toward ' + (g.title || 'a goal'), hex: 'hsl(var(--hue),68%,44%)', goal: g, ms: m };
  }
  return null;
}
function anchorText(a) {
  const i = anchorInfo(a);
  return i ? i.label : '';
}


/* ---- the anchor picker: type to filter, or write your own ---- */
let anchorOpen = false, anchorQ = '';

function anchorPicker(D, redraw) {
  const wrap = E('div');
  const cur = anchorInfo(D.anchor);

  wrap.append(E('button', {
    style: 'display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;' +
           'padding:8px 0;border-bottom:1px solid ' + (anchorOpen ? 'var(--acc)' : 'var(--rule)') + ';text-align:left',
    onclick: () => { anchorOpen = !anchorOpen; anchorQ = ''; redraw(); }
  }, [
    E('span', { style: 'font-size:15px;' + (cur ? `color:${cur.hex};font-weight:600` : 'color:var(--faint)'),
      text: cur ? cur.label : 'Nothing in particular' }),
    E('span', { style: 'color:var(--faint);font-size:12px', text: anchorOpen ? '\u25B2' : '\u25BC' })
  ]));
  if (!anchorOpen) return wrap;

  const pick = a => { D.anchor = a; anchorOpen = false; anchorQ = ''; save(); redraw(); };
  const input = E('input', { type: 'text', placeholder: 'Type to filter, or write your own', style: 'margin-top:10px' });
  input.value = anchorQ;
  const list = E('div', { style: 'max-height:union;margin-top:6px' });
  list.style.maxHeight = '270px'; list.style.overflowY = 'auto';

  const draw = () => {
    clear(list);
    const q = anchorQ.trim().toLowerCase();
    let shown = 0;

    if (!q) list.append(E('button', { cls: 'menu-item', style: 'font-size:13px;color:var(--mut)',
      onclick: () => pick(null) }, 'Nothing in particular'));

    anchorOptions().forEach(gr => {
      const hits = gr.items.filter(o => !q || o.t.toLowerCase().includes(q));
      if (!hits.length) return;
      list.append(E('h3', { style: 'margin:12px 0 2px', text: gr.label }));
      hits.forEach(o => {
        shown++;
        const info = anchorInfo(parseAnchor(o.v));
        list.append(E('button', {
          style: 'display:flex;width:100%;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);text-align:left',
          onclick: () => pick(parseAnchor(o.v))
        }, [
          E('span', { style: `width:4px;align-self:stretch;min-height:18px;border-radius:2px;background:${info ? info.hex : 'var(--rule)'};flex:none` }),
          E('span', { style: 'flex:1;min-width:0;font-size:14.5px', text: o.t })
        ]));
      });
    });

    const typed = anchorQ.trim();
    if (typed && !anchorOptions().some(gr => gr.items.some(o => o.t.toLowerCase() === typed.toLowerCase()))) {
      list.append(E('h3', { style: 'margin:12px 0 2px', text: 'Your own' }));
      list.append(E('button', { cls: 'btn fill', style: 'margin-top:4px',
        onclick: () => pick({ k: 'c', label: typed }) }, 'Hold today against \u201c' + typed + '\u201d'));
    } else if (q && !shown) {
      list.append(E('div', { cls: 'empty', text: 'Nothing matches.' }));
    }
  };

  input.addEventListener('input', e => { anchorQ = e.target.value; draw(); });
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const q = anchorQ.trim().toLowerCase();
    if (!q) return;
    for (const gr of anchorOptions()) {
      const hit = gr.items.find(o => o.t.toLowerCase().includes(q));
      if (hit) { pick(parseAnchor(hit.v)); return; }
    }
    pick({ k: 'c', label: anchorQ.trim() });
  });

  wrap.append(input);
  wrap.append(list);
  draw();
  requestAnimationFrame(() => input.focus());
  return wrap;
}


/* ===================== links typed inline ===================== */
const URL_RE = /\b((?:https?:\/\/|www\.)[^\s<>"'\)\]]+|(?:[a-z0-9][\w-]*\.)+[a-z]{2,}\/[^\s<>"'\)\]]*)/gi;

function foundLinks(text) {
  const out = [];
  String(text || '').replace(URL_RE, m => { out.push(m.replace(/[.,;:!?]+$/, '')); return m; });
  return out.filter((u, i) => out.indexOf(u) === i);
}

/* read-only prose with its URLs made live */
function linkified(text) {
  const wrap = E('span', { style: 'white-space:pre-wrap' });
  const str = String(text || '');
  let last = 0, m;
  URL_RE.lastIndex = 0;
  while ((m = URL_RE.exec(str)) !== null) {
    if (m.index > last) wrap.append(str.slice(last, m.index));
    const raw = m[0].replace(/[.,;:!?]+$/, '');
    wrap.append(E('a', { href: normUrl(raw), target: '_blank', rel: 'noopener noreferrer',
      style: 'color:var(--acc);text-decoration:underline;text-underline-offset:2px', text: raw }));
    if (raw.length < m[0].length) wrap.append(m[0].slice(raw.length));
    last = m.index + m[0].length;
  }
  if (last < str.length) wrap.append(str.slice(last));
  return wrap;
}

/* a textarea that surfaces any links inside it as tappable chips */
function areaWithLinks(obj, key, ph, big, host) {
  const wrap = E('div');
  const ta = bindArea(obj, key, ph, big);
  const chips = E('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;margin-top:7px' });
  const draw = () => {
    clear(chips);
    const urls = foundLinks(obj[key]);
    urls.forEach(u => {
      const src = sourceKind(u);
      chips.append(E('a', {
        href: normUrl(u), target: '_blank', rel: 'noopener noreferrer', cls: 'chip',
        style: 'font-size:12px;padding:5px 10px 5px 8px;text-decoration:none;color:var(--ink)'
      }, [E('span', { cls: 'dot', style: `background:${src.hex}` }), hostOf(u) || 'link']));
    });
    if (host && urls.length) {
      const already = new Set((host || []).map(l => normUrl(l.url)));
      const fresh = urls.filter(u => !already.has(normUrl(u)));
      if (fresh.length) chips.append(E('button', { cls: 'tag acc', style: 'align-self:center',
        onclick: () => {
          fresh.forEach(u => host.push({ id: uid(), url: normUrl(u), label: autoLabel(u), note: '' }));
          save(true); render();
        }}, 'Save ' + (fresh.length > 1 ? fresh.length + ' to sources' : 'to sources')));
    }
  };
  ta.addEventListener('input', draw);
  draw();
  wrap.append(ta, chips);
  return wrap;
}


/* ===================== boot ===================== */
window.addEventListener('beforeunload', () => save(true));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  save(true);
  if (S.cfg.auto && S.cfg.token && S.cfg.gist && dirty) cloudPush();
});
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}
render();
if (S.cfg.auto && S.cfg.token && S.cfg.gist) {
  cloudPull('merge').then(ok => { if (ok) render(); });
}
