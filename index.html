<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2026">
<meta name="theme-color" content="#EDEDEA">
<title>Goal Digger 2026</title>
<style>
:root{
  --ink:#15171B; --paper:#EDEDEA; --card:#FFFFFF; --rule:#D9D8D3;
  --mut:#74746F; --faint:#A3A29C;
  --hue:210; --acc:hsl(var(--hue),68%,44%); --wash:hsl(var(--hue),62%,95%); --edge:hsl(var(--hue),40%,84%);
  --disp:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Avenir Next",Avenir,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sp:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.45;overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}
button{background:none;border:0;padding:0;cursor:pointer}

/* ---------- layout ---------- */
#app{
  padding:calc(env(safe-area-inset-top) + 10px) calc(var(--sp) + 20px) 96px calc(var(--sp));
  max-width:760px;margin:0 auto;min-height:100vh;
}
.view{animation:rise .22s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- type ---------- */
.eyebrow{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mut)}
h1{font-family:var(--disp);font-weight:700;font-size:34px;line-height:.98;letter-spacing:.01em;
  text-transform:uppercase;margin:2px 0 2px}
h2{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;
  margin:0 0 10px;color:var(--ink)}
h3{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  margin:0 0 6px;color:var(--mut)}
.lede{color:var(--mut);font-size:13.5px;line-height:1.5;margin:0 0 14px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.topbar .sub{font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--acc);font-weight:600}
.accdot{width:11px;height:11px;border-radius:50%;background:var(--acc);display:inline-block;vertical-align:-1px;margin-right:6px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:16px;margin:0 0 12px}
.card.on{border-color:var(--edge);box-shadow:inset 3px 0 0 var(--acc)}
.card .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rule{height:1px;background:var(--rule);margin:14px 0}

/* ---------- fields ---------- */
.field{margin:0 0 14px}
.field:last-child{margin-bottom:0}
label.fl{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--mut);margin-bottom:5px;font-weight:600}
textarea,input[type=text],input[type=date],input[type=number]{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule);
  padding:5px 0 6px;resize:none;line-height:1.5;
}
textarea:focus,input:focus{outline:none;border-bottom-color:var(--acc)}
textarea::placeholder,input::placeholder{color:var(--faint)}
.linebox{border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.linebox input{border:0;padding:2px 0}
.num{font-family:var(--disp);font-size:12px;color:var(--faint);width:19px;flex:none;padding-top:5px;letter-spacing:.06em}

/* checkbox */
.box{width:19px;height:19px;flex:none;border:1.5px solid var(--rule);border-radius:2px;margin-top:4px;
  display:grid;place-items:center;background:#fff;transition:.15s}
.box.on{background:var(--acc);border-color:var(--acc)}
.box svg{width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0;transition:.15s}
.box.on svg{opacity:1}
.done{color:var(--faint);text-decoration:line-through}

/* scale */
.scale{display:flex;gap:4px;margin-top:4px}
.scale button{flex:1;height:30px;border:1px solid var(--rule);border-radius:2px;background:#fff;
  font-family:var(--disp);font-size:12px;color:var(--mut);letter-spacing:.04em}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:12px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;border:1px solid var(--rule);border-radius:2px;
  padding:9px 13px;background:#fff;color:var(--ink)}
.btn.fill{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{border-color:transparent;color:var(--acc);padding-left:0}
.btn:active{transform:scale(.985)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- chips / habits ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:#fff;
  border-radius:100px;padding:8px 13px 8px 10px;font-size:14px;line-height:1}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip.on{border-color:transparent;color:#fff}
.hgrid{width:100%;border-collapse:collapse;font-size:13px}
.hgrid th{font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--faint);font-weight:600;
  padding:0 0 6px;text-align:center;width:30px}
.hgrid th.nm{text-align:left;width:auto}
.hgrid td{padding:3px 0;text-align:center;border-top:1px solid var(--rule)}
.hgrid td.nm{text-align:left;padding-right:8px;font-size:14px}
.cell{width:24px;height:24px;border-radius:2px;border:1px solid var(--rule);background:#fff;display:inline-block}

/* ---------- day rows ---------- */
.day{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--rule);align-items:flex-start}
.day .dn{font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:var(--mut);width:44px;flex:none;padding-top:3px}
.day .dn b{display:block;font-size:19px;color:var(--ink);letter-spacing:0;line-height:1}
.day.today .dn b{color:var(--acc)}
.day textarea{min-height:26px}

/* ---------- progress ---------- */
.bar{height:4px;background:var(--paper);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .3s}
.pct{font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:var(--mut)}

/* ---------- spine ---------- */
#spine{position:fixed;top:0;right:0;bottom:0;width:20px;display:flex;flex-direction:column;z-index:40;
  padding:calc(env(safe-area-inset-top) + 6px) 0 84px}
#spine button{flex:1;position:relative;font-family:var(--disp);font-size:9px;letter-spacing:.06em;
  color:#fff;font-weight:700;writing-mode:vertical-rl;display:grid;place-items:center;opacity:.42;
  border-radius:2px 0 0 2px;margin:1px 0 1px 6px;transition:.18s}
#spine button.on{opacity:1;margin-left:0}

/* ---------- tabbar ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
#tabs button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--acc)}

/* ---------- misc ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.nav button{width:38px;height:38px;border:1px solid var(--rule);border-radius:2px;background:#fff;
  display:grid;place-items:center;font-size:17px;color:var(--mut)}
.nav .mid{text-align:center;flex:1;min-width:0}
.nav .mid h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--rule)}
.list-item:first-child{border-top:0}
.list-item .txt{flex:1;min-width:0}
.x{color:var(--faint);font-size:19px;line-height:1;padding:2px 4px;flex:none}
.tag{font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:2px;padding:3px 6px;color:var(--mut)}
.tag.acc{border-color:var(--acc);color:var(--acc)}
.menu-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
  padding:15px 0;border-bottom:1px solid var(--rule);font-family:var(--disp);font-size:15px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.menu-item small{font-family:var(--body);letter-spacing:0;text-transform:none;color:var(--mut);font-size:12.5px;
  font-weight:400;display:block;margin-top:2px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);opacity:0;
  background:var(--ink);color:#fff;font-family:var(--disp);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;padding:9px 15px;border-radius:2px;z-index:99;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{color:var(--faint);font-size:13.5px;padding:8px 0}
.quote{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:19px;line-height:1.12;
  color:var(--ink);margin:0}
.quote span{color:var(--faint);font-size:11px;letter-spacing:.16em;display:block;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.stat{text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:29px;line-height:1;letter-spacing:.01em}
.stat span{font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.wheel{display:block;margin:0 auto;max-width:300px;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<nav id="spine"></nav>
<nav id="tabs"></nav>
<div class="toast" id="toast">Saved</div>
<script>
/* ===================== core ===================== */
const KEY = 'goaldigger2026';
const YEAR = 2026;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const DEFAULT = () => ({
  v: 1, year: YEAR, meta: { updated: '', device: '' },
  f: {},            // long-form prompt answers, keyed by field id
  habits: [],       // {id,name,hue}
  hlog: {},         // "2026-08-15": ["h1","h2"]
  days: {},         // "2026-08-15": {note, tasks:[{t,d}]}
  weeks: {},        // "2026-W33": {focus,feel,grat[],goals[],todos[],notes,wins[],rate}
  months: {},       // "2026-08": {goals:[{t,focus[],notes}], am[], pm[], review:{}}
  goals: [],        // see newGoal()
  dump: [],         // {id,t,used}
  lists: [],        // {id,title,items:[{t,d}]}
  notes: [],        // {id,title,body,up,links}
  links: [],        // loose library: {id,label,url,note}
  cfg: { shortcut: 'Add Planner Reminder', calShortcut: 'Add Planner Event', list: '', time: '09:00', pasteTo: 'agenda',
    token: '', gist: '', auto: true, cloudPhotos: false, device: '' },
  agenda: { at: '', items: [] },  // read back from Reminders/Calendar via clipboard
  limbs: { days: {} },            // eight limbs: iso -> {marks,notes}
  studio: { project: { title: '', questions: '' }, entries: [] }
});

let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return DEFAULT();
    return Object.assign(DEFAULT(), JSON.parse(raw));
  } catch (e) { return DEFAULT(); }
}
let saveTimer, dirty = false;
function save(now) {
  clearTimeout(saveTimer);
  const write = () => {
    S.meta = S.meta || {};
    S.meta.updated = new Date().toISOString();
    S.meta.device = S.cfg.device || '';
    try { localStorage.setItem(KEY, JSON.stringify(S)); toast('Saved'); dirty = true; }
    catch (e) { toast('Storage full'); }
  };
  now ? write() : saveTimer = setTimeout(write, 700);
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1300);
}
const uid = () => Math.random().toString(36).slice(2, 9);

/* ===================== dates ===================== */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => iso(a) === iso(b);

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - day + 3);
  const first = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const fd = (first.getUTCDay() + 6) % 7;
  first.setUTCDate(first.getUTCDate() - fd + 3);
  return { y: t.getUTCFullYear(), w: 1 + Math.round((t - first) / 604800000) };
}
function mondayOf(y, w) {
  const first = new Date(y, 0, 4);
  const fd = (first.getDay() + 6) % 7;
  return addDays(first, -fd + (w - 1) * 7);
}
function weeksInYear(y) { return isoWeek(new Date(y, 11, 28)).w; }
const weekKey = (y, w) => y + '-W' + pad(w);
const monthKey = (y, m) => y + '-' + pad(m + 1);
const hueOf = m => m * 30;

/* month of a week = month containing its Thursday */
function weekMonth(y, w) { return addDays(mondayOf(y, w), 3).getMonth(); }

function setHue(m) {
  document.documentElement.style.setProperty('--hue', hueOf(m));
  document.querySelector('meta[name=theme-color]').setAttribute('content', '#EDEDEA');
}

/* ===================== dom ===================== */
function E(tag, attrs, kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'cls') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(c => {
    if (c == null || c === false) return;
    n.append(c.nodeType ? c : document.createTextNode(c));
  });
  return n;
}
const $ = s => document.querySelector(s);
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }

function grow(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
function autoGrowAll(root) { root.querySelectorAll('textarea').forEach(grow); }

const check = on => E('div', { cls: 'box' + (on ? ' on' : '') },
  E('span', { html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>' }));

/* ===================== bound inputs ===================== */
function bindArea(obj, k, ph, big) {
  const ta = E('textarea', {
    rows: big ? 4 : 2, placeholder: ph || '',
    oninput: e => { grow(e.target); obj[k] = e.target.value; save(); }
  });
  ta.value = obj[k] || '';
  requestAnimationFrame(() => grow(ta));
  return ta;
}
function bindText(obj, k, ph, type) {
  const i = E('input', {
    type: type || 'text', placeholder: ph || '',
    oninput: e => { obj[k] = e.target.value; save(); }
  });
  i.value = obj[k] || '';
  return i;
}
function bindLine(arr, i, ph, numbered) {
  const inp = E('input', { type: 'text', placeholder: ph || '', oninput: e => { arr[i] = e.target.value; save(); } });
  inp.value = arr[i] || '';
  return E('div', { cls: 'linebox' }, [numbered ? E('span', { cls: 'num', text: (i + 1) + '.' }) : null, inp]);
}
function scaleRow(obj, k, redraw) {
  const row = E('div', { cls: 'scale' });
  for (let n = 1; n <= 10; n++) {
    row.append(E('button', {
      cls: obj[k] === n ? 'on' : '', text: n,
      onclick: () => { obj[k] = obj[k] === n ? null : n; save(); redraw ? redraw() : render(); }
    }));
  }
  return row;
}
function field(label, node) {
  return E('div', { cls: 'field' }, [label ? E('label', { cls: 'fl', text: label }) : null, node]);
}


/* ===================== prompt schemas (from the journal) ===================== */
const A = (k, l, big) => ({ k, l, ty: 'area', big });
const T = (k, l) => ({ k, l, ty: 'text' });
const L = (k, l, n) => ({ k, l, ty: 'list', n: n || 5 });

const FOUNDATIONS = [
  { id: 'values', t: 'Core values', d: 'Your values sit at the centre of who you are. Goals set against them tend to stick; goals set across them tend to stall.', f: [
    L('values', 'My five core values', 5),
    { k: 'values_note', l: 'Who do I look up to, and what do they value?', ty: 'area' }
  ]},
  { id: 'strengths', t: 'Strengths', d: 'What you do easily, enjoy, and get told you are good at.', f: [
    L('strengths', 'My top five strengths', 5),
    A('str_flow', 'What do I lose track of time doing?'),
    A('str_others', 'What do others see in me that I might not?')
  ]},
  { id: 'purpose', t: 'Purpose', d: 'Where your skills, passion and values meet.', f: [
    A('p_excited', 'What situations get me really excited? What am I doing, who am I with?'),
    A('p_learn', 'What do I enjoy learning about?'),
    A('p_money', "If money wasn't an issue, what would I do with my life?"),
    A('p_help', 'What do I love doing that also helps others?'),
    A('p_change', 'What change do I want to make in the world?'),
    A('p_causes', 'What causes do I feel strongly about?'),
    A('p_value', 'How does what I love doing add value to others?'),
    A('p_living', 'Can I make a living from it?'),
    A('purpose', 'My purpose is…', 1)
  ]},
  { id: 'success', t: 'Definition of success', d: 'Not the inherited definition — yours. Five minutes, no editing.', f: [
    A('success', 'My definition of success is…', 1)
  ]},
  { id: 'toolkit', t: 'Toolkit for success', d: 'The people and things that keep you on track when it gets hard.', f: [
    L('accountability', 'Accountability partners', 4),
    L('dreamteam', 'Dream team — people who can help turn this into reality', 4),
    L('inspire', 'Books, podcasts and apps that inspire me', 4),
    L('happy', 'Places and things that make me happy', 4)
  ]},
  { id: 'lastyear', t: 'Wins and lessons from 2025', d: 'Evaluate the year behind you before you plan the one ahead.', f: [
    A('y_achieved', 'Amazing things I achieved in 2025'),
    A('y_wins', 'My wins'),
    A('y_misses', 'My misses'),
    A('y_lessons', 'My lessons'),
    A('y_grow', 'How did I grow in 2025?'),
    A('y_focus', 'What am I focusing on in 2026?'),
    A('y_excited', "Things I'm excited for in 2026"),
    { k: 'y_rate', l: 'Rate 2025 out of ten', ty: 'scale' }
  ]},
  { id: 'ratelife', t: 'Rate your life', d: 'Score each area now, then again at the end of the year. Balance is allocation, not equality.', special: 'ratelife' },
  { id: 'future', t: 'Mi Future', d: 'Think ahead to the life you want to be living.', special: 'future' },
  { id: 'vision', t: 'Vision and letter to self', d: 'Where the next one to five years are heading — and a letter written from the far end of this year.', f: [
    A('vision', 'Ideas for my vision board', 1),
    T('letter_date', 'Dated'),
    A('letter', 'A letter from my future self', 1)
  ]},
  { id: 'inout', t: 'In and out', d: 'What gives you energy in 2026, and what you are leaving in 2025.', f: [
    A('in', "In — habits, hobbies, people, places, choices", 1),
    A('out', 'Out — bad habits, poor choices, things that drain me', 1)
  ]},
  { id: 'habitq', t: 'Habits audit', d: 'You do not rise to the level of your goals, you fall to the level of your systems.', f: [
    A('h_good', 'What good habits currently exist in my day?'),
    A('h_bad', 'What bad habits might be holding me back?'),
    A('h_strengthen', 'How might I strengthen or enhance each good habit?'),
    A('h_replace', 'For each bad habit, what positive habit could replace it?'),
    A('h_layer', 'What habits can I layer onto my existing routine to reach my goals?')
  ]},
  { id: 'routines', t: 'Morning and evening routines', d: 'A good morning sets the day; a good evening sets the next one.', f: [
    A('r_morning', 'What could I do to set myself up for a positive morning? Getting outside is a must.'),
    A('r_evening', 'What could I do to relax and unwind at night, with less phone?'),
    A('r_feel', 'How do these make me feel — energised or drained, stressed or relaxed?')
  ]},
  { id: 'glance', t: '2026 at a glance', d: 'The single page version of the year.', f: [
    A('g_quote', 'Quote for the year — this shows on your Today screen'),
    A('g_feel', 'How do I want to feel in 2026?'),
    L('g_forward', 'Looking forward to', 3),

/* ===================== habits ===================== */
function habitsFor() { return S.habits.filter(h => !h.off); }
function logged(day, hid) { return (S.hlog[day] || []).includes(hid); }
function toggleHabit(day, hid) {
  const arr = S.hlog[day] = S.hlog[day] || [];
  const i = arr.indexOf(hid);
  i < 0 ? arr.push(hid) : arr.splice(i, 1);
  if (!arr.length) delete S.hlog[day];
  save();
}
function streak(hid) {
  let n = 0, d = new Date();
  if (!logged(iso(d), hid)) d = addDays(d, -1);
  while (logged(iso(d), hid)) { n++; d = addDays(d, -1); }
  return n;
}
function habitRate(hid, days) {
  let hit = 0;
  for (let i = 0; i < days; i++) if (logged(iso(addDays(new Date(), -i)), hid)) hit++;
  return Math.round(hit / days * 100);
}

/* ===================== goal progress ===================== */
function goalProgress(g) {
  let total = 0, done = 0;
  g.milestones.forEach(m => {
    total++; if (m.d) done++;
    (m.kt || []).forEach(k => { total++; if (k.d) done++; });
  });
  g.actions.forEach(a => { total++; if (a.d) done++; });
  if (!total) return g.completed ? 100 : 0;
  return Math.round(done / total * 100);
}

/* Calendar: a standards .ics file with an alarm on each dated item. */
function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n'); }
function icsStamp() { return new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z'; }
function buildIcs(events) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Goal Digger ' + YEAR + '//EN', 'CALSCALE:GREGORIAN'];
  const alarm = 'TRIGGER:PT' + parseInt((S.cfg.time || '09:00').split(':')[0], 10) + 'H';
  events.forEach((e, n) => {
    const d = e.date.replace(/-/g, ''), end = iso(addDays(parseIso(e.date), 1)).replace(/-/g, '');
    L.push('BEGIN:VEVENT', 'UID:gd' + YEAR + '-' + n + '-' + d + '@goaldigger', 'DTSTAMP:' + icsStamp(),
      'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + end, 'SUMMARY:' + icsEsc(e.title));
    if (e.notes) L.push('DESCRIPTION:' + icsEsc(e.notes));
    L.push('BEGIN:VALARM', alarm, 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(e.title), 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  /* fold long lines at 74 octets, as iCalendar requires */
  return L.map(line => {
    if (line.length <= 74) return line;
    const parts = [line.slice(0, 74)];
    for (let i = 74; i < line.length; i += 73) parts.push(' ' + line.slice(i, i + 73));
    return parts.join('\r\n');
  }).join('\r\n');
}
function datedItems() {
  const out = [];
  S.goals.forEach(g => {
    if (g.completed) return;
    if (g.due) out.push({ date: g.due, title: (g.title || 'Goal') + ' — due', notes: g.what });
    g.milestones.forEach(m => { if (m.due && !m.d) out.push({ date: m.due, title: (m.t || 'Milestone') + ' — ' + (g.title || 'goal'), notes: '' }); });
  });
  return out.sort((a, b) => a.date < b.date ? -1 : 1);
}

/* ---- reading Reminders/Calendar back in, via the clipboard ---- */
function parseAgenda(text) {
  if (!text || !text.trim()) return [];
  const t = text.trim();
  if (t[0] === '[' || t[0] === '{') {
    try {
      const j = JSON.parse(t);
      const arr = Array.isArray(j) ? j : (j.items || []);
      return arr.map(o => ({ t: (o.title || o.t || '').trim(), d: (o.due || o.date || o.d || '').slice(0, 10) }))
        .filter(o => o.t);
    } catch (e) { /* fall through to line parsing */ }
  }
  const out = [];
  t.split(/\r?\n/).forEach(line => {
    let s = line.replace(/^[\s\u2022\-*]+/, '').trim();
    if (!s) return;
    let d = '';
    const m = s.match(/^(\d{4}-\d{2}-\d{2})(?:[ T]\d{1,2}:\d{2}(?::\d{2})?)?\s*[|\u2013\u2014:,-]?\s*(.*)$/);
    if (m && m[2]) { d = m[1]; s = m[2].trim(); }
    if (s) out.push({ t: s, d });
  });
  return out;
}
function setAgenda(text) {
  const items = parseAgenda(text);
  if (!items.length) { toast('Nothing readable'); return false; }
  S.agenda = { at: iso(new Date()), items };
  save(true);
  toast(items.length + ' brought in');
  return true;
}
function agendaFor(dayIso) {
  return (S.agenda.items || []).filter(i => i.d === dayIso || !i.d);
}


/* ---- routing pasted text to wherever it belongs ---- */
function ingest(text, dest) {
  const items = parseAgenda(text);
  if (!items.length) { toast('Nothing readable'); return false; }
  const to = dest || S.cfg.pasteTo || 'agenda';
  if (to === 'today') {
    const D = day(iso(new Date()));
    items.forEach(i => D.tasks.push({ t: i.t, d: false }));
    toast(items.length + " added to today's list");
  } else if (to === 'dump') {
    items.forEach(i => S.dump.push({ id: uid(), t: i.t }));
    toast(items.length + ' added to the brain dump');
  } else if (to === 'week') {
    const wk = isoWeek(new Date()), W = week(wk.y, wk.w);
    items.forEach(i => W.todos.push({ t: i.t, d: false }));
    toast(items.length + " added to this week's to-dos");
  } else {
    S.agenda = { at: iso(new Date()), items };
    toast(items.length + ' brought in');
  }
  save(true);
  return true;
}

    sc.append(E('h2', { text: 'Start here' }));
    sc.append(E('p', { cls: 'lede', text: 'The planner works in one direction: values first, then goals, then the habits that carry them, then weeks. You can also just start writing today and come back to the rest.' }));
    sc.append(E('div', { cls: 'btnrow' }, [
      E('button', { cls: 'btn fill', text: 'My 2026', onclick: () => go('more', 'found') }),
      E('button', { cls: 'btn', text: 'Set goals', onclick: () => go('goals') }),
      E('button', { cls: 'btn', text: 'Add habits', onclick: () => go('more', 'habits') })
    ]));
    v.append(sc);
  }

  if ((S.f.g_quote || '').trim()) {
    v.append(E('div', { cls: 'card on' }, E('p', { cls: 'quote' }, [
      S.f.g_quote.trim(), E('span', { text: 'My quote for the year' })
    ])));
  }

  /* habits */
  const hc = E('div', { cls: 'card' });
  hc.append(E('div', { cls: 'head' }, [E('h2', { text: isNow ? 'Habits today' : 'Habits' }),
    E('button', { cls: 'btn ghost', text: 'Edit', onclick: () => go('more', 'habits') })]));
  if (!habitsFor().length) {
    hc.append(E('div', { cls: 'empty', text: 'No habits yet. Set one or two per goal — small enough to do on your worst day.' }));
    hc.append(E('button', { cls: 'btn', text: '+ Add habit', style: 'margin-top:10px', onclick: () => go('more', 'habits') }));
  } else {
    const chips = E('div', { cls: 'chips' });
    habitsFor().forEach(h => {
      const on = logged(k, h.id);
      const st = streak(h.id);
      chips.append(E('button', {
        cls: 'chip' + (on ? ' on' : ''),
        style: on ? `background:hsl(${h.hue},62%,44%)` : '',
        onclick: () => { toggleHabit(k, h.id); render(); }
      }, [
        E('span', { cls: 'dot', style: `background:${on ? '#fff' : `hsl(${h.hue},62%,50%)`}` }),
        h.name || 'Habit',
        st > 1 ? E('span', { style: 'font-size:11.5px;opacity:.7', text: st + 'd' }) : null
      ]));
    });
    hc.append(chips);
  }
  v.append(hc);

  /* today's list */
  const tc = E('div', { cls: 'card' });
  tc.append(E('h2', { text: isNow ? "Today's list" : 'List for this day' }));
  tc.append(checkList(D.tasks, 'Nothing planned. Add the one thing that would make today count.', render));
  tc.append(E('div', { cls: 'btnrow' }, remBtn('Send to Reminders',
    () => D.tasks.filter(t => !t.d).map(t => ({ title: t.t, due: k })))));
  tc.append(E('div', { cls: 'rule' }));
  tc.append(field(isNow ? 'Notes on today' : 'Notes', areaWithLinks(D, 'note', 'What happened, what you noticed, what you made. Paste links freely.', 1, S.links)));
  v.append(tc);

  /* from the phone */
  const ag = agendaFor(k);
  const ac = E('div', { cls: 'card' });
  ac.append(E('div', { cls: 'head' }, [E('h2', { text: 'From your iPhone' }),
    E('button', { cls: 'btn ghost', text: 'Bring in', onclick: () => go('more', 'sync') })]));
  if (!S.agenda.items.length) {
    ac.append(E('div', { cls: 'empty', text: 'Nothing pulled in yet. A shortcut can copy today from Reminders and Calendar, then you paste it here.' }));
  } else if (!ag.length) {
    ac.append(E('div', { cls: 'empty', text: 'Nothing due on this day in what you last brought in (' + S.agenda.at + ').' }));
  } else {
    ag.forEach(i => ac.append(E('div', { cls: 'list-item' }, [
      E('span', { cls: 'txt', style: 'font-size:14.5px', text: i.t }),
      E('button', { cls: 'tag acc', text: 'Add', onclick: () => { D.tasks.push({ t: i.t, d: false }); save(); render(); } })
    ])));
    ac.append(E('div', { cls: 'pct', style: 'margin-top:8px', text: 'Brought in ' + S.agenda.at + ' · read-only copy' }));
  }
  v.append(ac);

  /* week glance */
  const W = week(wk.y, wk.w);
  const wc = E('div', { cls: 'card' });
  wc.append(E('div', { cls: 'head' }, [E('h2', { text: isNow ? 'This week' : 'That week' }),
    E('button', { cls: 'btn ghost', text: 'Open week', onclick: () => { R.wk = wk; go('week'); } })]));
  wc.append(field('Weekly focus', bindArea(W, 'focus', 'The one thing this week is for.')));
  W.goals = W.goals || [];
  const wg = E('div');
  for (let i = 0; i < 3; i++) wg.append(bindLine(W.goals, i, '', true));
  wc.append(field('Weekly goals', wg));
  if (W.todos.length) {
    const open = W.todos.filter(t => !t.d).length;
    wc.append(E('div', { cls: 'pct', style: 'margin-top:10px', text: open + ' of ' + W.todos.length + ' to-dos still open' }));
  }
  v.append(wc);

  /* practice + studio */
  const pc = E('div', { cls: 'card' });
  pc.append(E('div', { cls: 'head' }, [E('h2', { text: 'Practice' }),
    E('button', { cls: 'btn ghost', text: 'Open', onclick: () => go('practice') })]));
  pc.append(limbSpectrum(k, 22));
  const eng = limbsEngaged(k), lst = limbStreak();
  pc.append(E('div', { cls: 'pct', style: 'margin-top:8px',
    text: eng ? eng + ' of 8 limbs met' + (lst > 1 ? ' · ' + lst + ' days unbroken' : '') : 'Nothing marked today' }));
  v.append(pc);

  const sessions = entriesFor(k);
  const stc = E('div', { cls: 'card' });
  stc.append(E('div', { cls: 'head' }, [E('h2', { text: 'Studio' }),
    E('button', { cls: 'btn ghost', text: sessions.length ? 'Open' : '+ Session',
      onclick: () => { studioView = sessions.length ? 'list' : 'form'; editingId = null; formDate = k; go('studio'); } })]));
  if (!sessions.length) stc.append(E('div', { cls: 'empty', text: 'No session documented on this day.' }));
  sessions.forEach(e => stc.append(E('div', { cls: 'list-item' }, [
    E('span', { cls: 'txt', style: 'font-size:14.5px', text: e.title || 'Untitled session' }),
    E('span', { style: 'display:flex;gap:4px' }, MODES.map(m =>
      E('span', { style: `width:16px;height:4px;border-radius:2px;background:${m.hex};opacity:${(e[m.id] || '').trim() ? 1 : .16}` })))
  ])));
  v.append(stc);

  /* goals in flight */
  const live = S.goals.filter(g => !g.completed).slice(0, 4);
  const gc = E('div', { cls: 'card' });
  gc.append(E('div', { cls: 'head' }, [E('h2', { text: 'Goals in flight' }),
    E('button', { cls: 'btn ghost', text: 'All goals', onclick: () => go('goals') })]));
  if (!live.length) gc.append(E('div', { cls: 'empty', text: 'No open goals. Start with a brain dump, then pick no more than eight.' }));
  live.forEach(g => {
    const p = goalProgress(g);
    gc.append(E('button', { style: 'display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--rule)',
      onclick: () => go('goals', null, g.id) }, [
      E('div', { style: 'display:flex;justify-content:space-between;gap:10px;align-items:baseline' }, [
        E('span', { text: g.title || 'Untitled goal' }),
        E('span', { cls: 'pct', text: p + '%' })
      ]),
      E('div', { cls: 'bar' }, E('i', { style: 'width:' + p + '%' }))
    ]));
  });
  v.append(gc);
  return v;
}

/* ===================== WEEK ===================== */
function viewWeek() {
  const { y, w } = R.wk, W = week(y, w), mon = mondayOf(y, w), sun = addDays(mon, 6);
  const v = E('div');
  const span = mon.getDate() + ' ' + MONTHS[mon.getMonth()].slice(0, 3) +
    ' – ' + sun.getDate() + ' ' + MONTHS[sun.getMonth()].slice(0, 3);

  v.append(E('div', { cls: 'nav' }, [
    E('button', { text: '‹', 'aria-label': 'Previous week', onclick: () => { R.wk = isoWeek(addDays(mon, -7)); render(); } }),
    E('div', { cls: 'mid' }, [
      E('div', { cls: 'eyebrow', text: 'Week ' + pad(w) }),
      E('div', { style: 'font-family:var(--disp);font-size:21px;text-transform:uppercase;letter-spacing:.04em;font-weight:700', text: span })
    ]),
    E('button', { text: '›', 'aria-label': 'Next week', onclick: () => { R.wk = isoWeek(addDays(mon, 7)); render(); } })
  ]));

  const c1 = E('div', { cls: 'card on' });
  c1.append(field('Weekly focus', bindArea(W, 'focus')));
  c1.append(field('How I want to feel this week', bindArea(W, 'feel')));
  v.append(c1);

  const c2 = E('div', { cls: 'card' });
  W.grat = W.grat || []; W.goals = W.goals || [];
  const g1 = E('div'); for (let i = 0; i < 3; i++) g1.append(bindLine(W.grat, i, '', true));
  c2.append(field('Grateful for', g1));
  const g2 = E('div'); for (let i = 0; i < 3; i++) g2.append(bindLine(W.goals, i, '', true));
  c2.append(field('Weekly goals', g2));
  v.append(c2);

  /* habit grid */
  if (habitsFor().length) {
    const hc = E('div', { cls: 'card' });
    hc.append(E('h2', { text: 'Habits' }));
    const tbl = E('table', { cls: 'hgrid' });
    const hr = E('tr', {}, E('th', { cls: 'nm' }));
    DOW.forEach(d => hr.append(E('th', { text: d[0] })));
    hr.append(E('th', { text: 'No.' }));
    tbl.append(E('thead', {}, hr));
    const tb = E('tbody');
    habitsFor().forEach(h => {
      const tr = E('tr', {}, E('td', { cls: 'nm' }, [
        E('span', { style: `display:inline-block;width:8px;height:8px;border-radius:50%;background:hsl(${h.hue},62%,50%);margin-right:7px` }),
        h.name || 'Habit'
      ]));
      let n = 0;
      for (let i = 0; i < 7; i++) {
        const dk = iso(addDays(mon, i)), on = logged(dk, h.id);
        if (on) n++;
        tr.append(E('td', {}, E('button', {
          cls: 'cell', style: on ? `background:hsl(${h.hue},62%,48%);border-color:transparent` : '',
          'aria-label': h.name + ' ' + dk,
          onclick: () => { toggleHabit(dk, h.id); render(); }
        })));
      }
      tr.append(E('td', { cls: 'mono', style: 'font-size:12px;color:var(--mut)', text: n }));
      tb.append(tr);
    });
    tbl.append(tb);
    hc.append(tbl);
    v.append(hc);
  }

  /* days */
  const dc = E('div', { cls: 'card' });
  dc.append(E('h2', { text: 'The week' }));
  for (let i = 0; i < 7; i++) {
    const dt = addDays(mon, i), dk = iso(dt), D = day(dk), isToday = sameDay(dt, new Date());
    const row = E('div', { cls: 'day' + (isToday ? ' today' : '') });
    row.append(E('button', { cls: 'dn', style: 'text-align:left', 'aria-label': 'Open ' + dk,
      onclick: () => { R.day = dk; go('today'); } }, [DOW[i], E('b', { text: pad(dt.getDate()) })]));
    const body = E('div', { style: 'flex:1;min-width:0' });
    if (limbsEngaged(dk) || entriesFor(dk).length) {
      body.append(E('div', { style: 'display:flex;gap:6px;align-items:center;margin-bottom:4px' }, [
        limbsEngaged(dk) ? E('div', { style: 'flex:1;max-width:120px' }, limbSpectrum(dk, 5)) : null,
        entriesFor(dk).length ? E('span', { cls: 'pct', style: 'color:#C6337E', text: 'studio' }) : null
      ]));
    }
    if ((D.intent || '').trim() || D.anchor) {
      const ai2 = anchorInfo(D.anchor);
      body.append(E('div', { style: 'margin-bottom:2px' }, [
        (D.intent || '').trim() ? E('span', {
          style: 'font-family:var(--disp);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)',
          text: D.intent }) : null,
        ai2 ? E('span', { style: `font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:${ai2.hex};margin-left:7px`, text: ai2.label }) : null
      ]));
    }
    body.append(bindArea(D, 'note', isToday ? 'Today…' : ''));
    D.tasks.forEach((t, ti) => {
      body.append(E('div', { style: 'display:flex;gap:8px;align-items:flex-start;padding:3px 0' }, [
        E('button', { cls: 'box' + (t.d ? ' on' : ''),
          html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>',
          onclick: () => { t.d = !t.d; save(); render(); } }),
        E('span', { cls: (t.d ? 'done ' : '') + 'txt', style: 'font-size:14px;padding-top:2px', text: t.t || '—' })
      ]));
    });
    row.append(body);
    dc.append(row);
  }
  v.append(dc);

  const c3 = E('div', { cls: 'card' });
  c3.append(E('h2', { text: 'Things to do' }));
  c3.append(checkList(W.todos, 'Nothing listed for this week yet.', render));
  c3.append(E('div', { cls: 'btnrow' }, remBtn('Send to Reminders',
    () => W.todos.filter(t => !t.d).map(t => ({ title: t.t, due: iso(sun) })))));
  c3.append(E('div', { cls: 'rule' }));
  c3.append(field('Notes', areaWithLinks(W, 'notes', '', 1, S.links)));
  v.append(c3);

  const c4 = E('div', { cls: 'card' });
  W.wins = W.wins || [];
  const wl = E('div'); for (let i = 0; i < 3; i++) wl.append(bindLine(W.wins, i, '', true));
  c4.append(field('Top three wins', wl));
  c4.append(field('Rate this week', scaleRow(W, 'rate')));
  v.append(c4);
  return v;
}

/* ===================== MONTH ===================== */
function viewMonth() {
  const m = R.mo, M = month(YEAR, m), v = E('div');
  v.append(E('div', { cls: 'nav' }, [
    E('button', { text: '‹', 'aria-label': 'Previous month', onclick: () => { R.mo = (m + 11) % 12; render(); } }),
    E('div', { cls: 'mid' }, [
      E('div', { cls: 'eyebrow', text: YEAR }),
      E('div', { style: 'font-family:var(--disp);font-size:27px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;line-height:1', text: MONTHS[m] })
    ]),
    E('button', { text: '›', 'aria-label': 'Next month', onclick: () => { R.mo = (m + 1) % 12; render(); } })
  ]));

  /* calendar */
  const cal = E('div', { cls: 'card' });
  const first = new Date(YEAR, m, 1), startPad = (first.getDay() + 6) % 7;
  const dim = new Date(YEAR, m + 1, 0).getDate();
  const grid = E('div', { style: 'display:grid;grid-template-columns:repeat(7,1fr);gap:3px' });
  DOW.forEach(d => grid.append(E('div', { cls: 'eyebrow', style: 'text-align:center;font-size:9px', text: d[0] })));
  for (let i = 0; i < startPad; i++) grid.append(E('div'));
  for (let dn = 1; dn <= dim; dn++) {
    const dt = new Date(YEAR, m, dn), dk = iso(dt);
    const hits = (S.hlog[dk] || []).length;
    const hasNote = (S.days[dk] && (S.days[dk].note || S.days[dk].tasks.length));
    const isToday = sameDay(dt, new Date());
    grid.append(E('button', {
      style: `aspect-ratio:1;border:1px solid ${isToday ? 'var(--acc)' : 'var(--rule)'};border-radius:2px;background:${hits ? `hsl(var(--hue),62%,${96 - Math.min(hits, 5) * 8}%)` : '#fff'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px`,
      onclick: () => { R.day = dk; go('today'); }
    }, [
      E('span', { cls: 'mono', style: 'font-size:12.5px;' + (isToday ? 'color:var(--acc);font-weight:700' : ''), text: dn }),
      E('span', { style: 'display:flex;gap:2px;height:4px' }, [
        E('span', { style: `width:4px;height:4px;border-radius:50%;background:${hasNote ? 'var(--ink)' : 'transparent'}` }),
        limbsEngaged(dk) ? E('span', { style: 'width:4px;height:4px;border-radius:50%;background:#7E4FA3' }) : null,
        entriesFor(dk).length ? E('span', { style: 'width:4px;height:4px;border-radius:50%;background:#C6337E' }) : null
      ])
    ]));
  }
  cal.append(grid);
  cal.append(E('div', { cls: 'pct', style: 'margin-top:10px', text: 'Tap a day to open it · shade = habits · black dot = written · violet = practice · pink = studio' }));
  v.append(cal);

  /* month goals */
  const gc = E('div', { cls: 'card' });
  gc.append(E('h2', { text: MONTHS[m] + ' goals' }));
  M.goals.forEach((g, i) => {
    const blk = E('div', { style: i ? 'margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)' : '' });
    blk.append(field('Goal ' + (i + 1), bindText(g, 't', 'What are you moving this month?')));
    g.focus = g.focus || [];
    const fl = E('div'); for (let j = 0; j < 3; j++) fl.append(bindLine(g.focus, j, 'Focus ' + (j + 1), true));
    blk.append(field('Focus', fl));
    blk.append(field('Notes', bindArea(g, 'notes')));
    gc.append(blk);
  });
  v.append(gc);

  /* rituals */
  const rc = E('div', { cls: 'card' });
  rc.append(E('h2', { text: 'Rituals' }));
  M.am = M.am || []; M.pm = M.pm || [];
  const am = E('div'); for (let i = 0; i < 5; i++) am.append(bindLine(M.am, i, '', true));
  rc.append(field('My morning rituals', am));
  const pm = E('div'); for (let i = 0; i < 5; i++) pm.append(bindLine(M.pm, i, '', true));
  rc.append(field('My evening rituals', pm));
  v.append(rc);

  /* review */
  const vc = E('div', { cls: 'card' });
  vc.append(E('h2', { text: MONTHS[m] + ' review' }));
  vc.append(E('p', { cls: 'lede', text: 'Fill this at the end of the month — it feeds the mid-year and yearly reviews.' }));
  vc.append(renderFields(MONTH_REVIEW, M.review));
  v.append(vc);

  /* weeks of this month */
  const wc = E('div', { cls: 'card' });
  wc.append(E('h2', { text: 'Weeks' }));
  const total = weeksInYear(YEAR);
  for (let w = 1; w <= total; w++) {
    if (weekMonth(YEAR, w) !== m) continue;
    const W = S.weeks[weekKey(YEAR, w)], mon = mondayOf(YEAR, w);
    wc.append(E('button', { style: 'display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--rule);text-align:left',
      onclick: () => { R.wk = { y: YEAR, w }; go('week'); } }, [
      E('span', {}, [E('span', { cls: 'eyebrow', text: 'W' + pad(w) + '  ' }),
        E('span', { style: 'font-size:14px', text: (W && W.focus ? W.focus.split('\n')[0].slice(0, 40) : mon.getDate() + ' ' + MONTHS[mon.getMonth()].slice(0, 3)) })]),
      E('span', { cls: 'pct', text: W && W.rate ? W.rate + '/10' : '–' })
    ]));
  }
  v.append(wc);
  return v;
}


/* ===================== GOALS ===================== */
function viewGoals() {
  const v = E('div');
  v.append(E('div', { cls: 'topbar' }, E('div', {}, [
    E('div', { cls: 'eyebrow', text: 'Strategy' }),
    E('h1', { text: 'Goals' }),
    E('div', { cls: 'sub', text: S.goals.filter(g => !g.completed).length + ' open · ' + S.goals.filter(g => g.completed).length + ' achieved' })
  ])));

  const section = (title, kind, note) => {
    const c = E('div', { cls: 'card' });
    c.append(E('div', { cls: 'head' }, [E('h2', { text: title }),
      E('button', { cls: 'btn ghost', text: '+ New', onclick: () => { const g = newGoal(kind); S.goals.push(g); save(true); go('goals', null, g.id); } })]));
    const list = S.goals.filter(g => g.kind === kind);
    if (!list.length) c.append(E('div', { cls: 'empty', text: note }));
    list.forEach(g => {
      const p = goalProgress(g);
      c.append(E('button', { style: 'display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--rule)',
        onclick: () => go('goals', null, g.id) }, [
        E('div', { style: 'display:flex;justify-content:space-between;gap:10px;align-items:baseline' }, [
          E('span', { style: g.completed ? 'color:var(--faint);text-decoration:line-through' : '', text: g.title || 'Untitled goal' }),
          E('span', { cls: 'pct', text: g.completed ? 'Done' : p + '%' })
        ]),
        g.when ? E('div', { cls: 'pct', style: 'margin-top:3px', text: 'By ' + g.when }) : null,
        E('div', { cls: 'bar' }, E('i', { style: 'width:' + (g.completed ? 100 : p) + '%' }))
      ]));
    });
    return c;
  };
  v.append(section('Long-term goals', 'long', 'Six months and beyond. Three is plenty.'));
  v.append(section('Short-term goals', 'short', 'One to twelve weeks. These are the ones that build momentum.'));

  /* brain dump */
  const bc = E('div', { cls: 'card' });
  bc.append(E('h2', { text: 'Brain dump' }));
  bc.append(E('p', { cls: 'lede', text: 'Everything you could work on this year. Let it run wild, then promote the ones that matter — no more than eight.' }));
  S.dump.forEach((it, i) => {
    bc.append(E('div', { cls: 'list-item' }, [
      E('div', { cls: 'txt' }, (() => {
        const ta = E('textarea', { rows: 1, oninput: e => { grow(e.target); it.t = e.target.value; save(); } });
        ta.value = it.t; requestAnimationFrame(() => grow(ta)); return ta;
      })()),
      E('button', { cls: 'tag acc', text: 'Make goal', onclick: () => {
        const g = newGoal('short'); g.title = it.t; S.goals.push(g);
        S.dump.splice(i, 1); save(true); go('goals', null, g.id);
      }}),
      E('button', { cls: 'x', text: '×', onclick: () => { S.dump.splice(i, 1); save(); render(); } })
    ]));
  });

/* ---------- year ring ---------- */
function pageYear() {
  const v = E('div');
  v.append(backBar('Year at a glance'));
  v.append(E('p', { cls: 'lede', text: 'Each spoke is a week, coloured by its month and drawn to the score you gave it. Tap one to open that week.' }));

  const total = weeksInYear(YEAR), C = 150, R0 = 52, NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 300 300'); svg.setAttribute('class', 'wheel');
  const cur = isoWeek(new Date());
  for (let w = 1; w <= total; w++) {
    const W = S.weeks[weekKey(YEAR, w)], m = weekMonth(YEAR, w);
    const a0 = (w - 1) / total * Math.PI * 2 - Math.PI / 2, a1 = w / total * Math.PI * 2 - Math.PI / 2;
    const a = (a0 + a1) / 2, len = W && W.rate ? 12 + W.rate * 8 : 6;
    const g = document.createElementNS(NS, 'line');
    g.setAttribute('x1', C + Math.cos(a) * R0); g.setAttribute('y1', C + Math.sin(a) * R0);
    g.setAttribute('x2', C + Math.cos(a) * (R0 + len)); g.setAttribute('y2', C + Math.sin(a) * (R0 + len));
    g.setAttribute('stroke', W && W.rate ? `hsl(${hueOf(m)},64%,48%)` : '#D9D8D3');
    g.setAttribute('stroke-width', 300 / total * 0.62); g.setAttribute('stroke-linecap', 'butt');
    if (w === cur.w) g.setAttribute('stroke', `hsl(${hueOf(m)},70%,38%)`);
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => { R.wk = { y: YEAR, w }; go('week'); });
    svg.appendChild(g);
  }
  MONTHS.forEach((mo, i) => {
    const a = (i + .5) / 12 * Math.PI * 2 - Math.PI / 2;
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', C + Math.cos(a) * 138); t.setAttribute('y', C + Math.sin(a) * 138 + 3);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '9');
    t.setAttribute('fill', `hsl(${hueOf(i)},55%,44%)`);
    t.setAttribute('font-family', 'var(--disp)'); t.setAttribute('letter-spacing', '.1em');
    t.textContent = mo.slice(0, 3).toUpperCase();
    svg.appendChild(t);
  });
  const mid = document.createElementNS(NS, 'text');
  mid.setAttribute('x', C); mid.setAttribute('y', C + 8); mid.setAttribute('text-anchor', 'middle');
  mid.setAttribute('font-size', '30'); mid.setAttribute('font-family', 'var(--disp)');
  mid.setAttribute('fill', '#15171B'); mid.textContent = YEAR;
  svg.appendChild(mid);

  const c = E('div', { cls: 'card' }); c.append(svg); v.append(c);

  const gl = E('div', { cls: 'card' });
  gl.append(E('h2', { text: '2026 at a glance' }));
  gl.append(renderFields(FOUNDATIONS.find(s => s.id === 'glance').f, S.f));
  v.append(gl);
  return v;
}

}

/* ---------- merging the earlier apps ---------- */
function mergeLimbs(days) {
  let n = 0;
  Object.entries(days || {}).forEach(([k, e]) => {
    if (!e || (!e.marks && !e.notes)) return;
    const cur = S.limbs.days[k] || { marks: {}, notes: {} };
    S.limbs.days[k] = { marks: Object.assign({}, e.marks || {}, cur.marks),
                        notes: Object.assign({}, e.notes || {}, cur.notes) };
    n++;
  });
  return n;
}
function mergeStudio(data) {
  if (!data) return 0;
  if (data.project && !S.studio.project.title) S.studio.project = data.project;
  const have = new Set(S.studio.entries.map(e => e.id));
  let n = 0;
  (data.entries || []).forEach(e => {
    if (have.has(e.id)) return;
    S.studio.entries.push(Object.assign({ media: [], themes: [], goal: '' }, e));
    n++;
  });
  return n;
}
function importLegacy(key) {
  let raw = null;
  try { raw = localStorage.getItem(key); } catch (e) {}
  if (!raw) { toast('Nothing stored here'); return; }
  try {
    const data = JSON.parse(raw);
    const n = key === 'eightlimbs' ? mergeLimbs(data) : mergeStudio(data);
    save(true); render();
    toast(n + (key === 'eightlimbs' ? ' days merged' : ' sessions merged'));
  } catch (e) { toast('Could not read it'); }
}
function importLegacyText(text) {
  /* accepts a JSON export from either app, or the whole HTML file with data inside */
  let data = null;
  try { data = JSON.parse(text); } catch (e) {}
  if (!data) { toast('Could not read that file'); return; }
  let n = 0;
  if (data.entries) n = mergeStudio(data);
  else if (data.limbs || data.studio) { n = mergeLimbs((data.limbs || {}).days) + mergeStudio(data.studio); }
  else n = mergeLimbs(data);
  save(true); render();
  toast(n ? n + ' merged' : 'Nothing new found');
}


/* ===================== markdown export ===================== */
function toMarkdown() {
  const out = [];
  const put = (label, val) => { if (val && String(val).trim()) out.push('**' + label + '**  \n' + String(val).trim() + '\n'); };
  const putList = (label, arr) => {
    const items = (arr || []).filter(x => x && String(x).trim());
    if (items.length) out.push('**' + label + '**\n' + items.map(x => '- ' + x).join('\n') + '\n');
  };
  out.push('# Goal Digger ' + YEAR + '\n');
  out.push('_Exported ' + iso(new Date()) + '_\n');

  out.push('\n## My ' + YEAR + '\n');
  FOUNDATIONS.forEach(s => {
    out.push('\n### ' + s.t + '\n');
    if (s.special === 'ratelife') {
      LIFE_AREAS.forEach((n, i) => {
        const r = (S.f.life || {})['a' + i] || {};
        if (r.start || r.end) out.push('- ' + n + ': start ' + (r.start || '–') + ', end ' + (r.end || '–'));
      });
      out.push('');
    } else if (s.special === 'future') {
      HORIZONS.forEach(([k, l]) => {
        ['be', 'have', 'feel'].forEach(p => put(l + ' — I will ' + p, S.f['fu_' + k + '_' + p]));
      });
    } else s.f.forEach(f => f.ty === 'list' ? putList(f.l, S.f[f.k]) : put(f.l, S.f[f.k]));
  });

  out.push('\n## Goals\n');
  S.goals.forEach(g => {
    out.push('\n### ' + (g.title || 'Untitled') + ' (' + g.kind + '-term, ' + goalProgress(g) + '%)\n');
    put('What', g.what); put('Why', g.why); put('How', g.how);
    put('When', g.when); put('Feeling I am chasing', g.feeling); put('Reward', g.reward);
    if (g.milestones.length) {
      out.push('**Milestones**');
      g.milestones.forEach(m => {
        out.push('- [' + (m.d ? 'x' : ' ') + '] ' + (m.t || ''));
        (m.kt || []).forEach(k => out.push('    - [' + (k.d ? 'x' : ' ') + '] ' + (k.t || '')));
      });
      out.push('');
    }
    if (g.actions.length) {
      out.push('**Actions**\n' + g.actions.map(a => '- [' + (a.d ? 'x' : ' ') + '] ' + a.t).join('\n') + '\n');
    }
    if (g.completed) { put('Achieved', g.completed); put('Outcome', g.outcome); }
    Object.entries(g.review || {}).forEach(([k, val]) => put(k, val));
  });

  out.push('\n## The year, week by week\n');
  for (let w = 1; w <= weeksInYear(YEAR); w++) {
    const W = S.weeks[weekKey(YEAR, w)];
    const mon = mondayOf(YEAR, w);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const dk = iso(addDays(mon, i)), D = S.days[dk];
      if (D && ((D.note || '').trim() || (D.intent || '').trim() || D.anchor || D.tasks.length)) {
        days.push('- **' + DOW[i] + ' ' + dk + '** ' +
          ((D.intent || '').trim() ? '_' + D.intent.trim() + '_' + (anchorText(D.anchor) ? ' [' + anchorText(D.anchor) + ']' : '') + ' — ' : '') +
          (D.note || '').trim().replace(/\n/g, ' ') +
          D.tasks.filter(t => t.t).map(t => '\n    - [' + (t.d ? 'x' : ' ') + '] ' + t.t).join(''));
      }
    }
    const hasW = W && (W.focus || W.notes || (W.wins || []).some(x => x) || W.rate);
    if (!hasW && !days.length) continue;
    out.push('\n### Week ' + pad(w) + ' — ' + mon.getDate() + ' ' + MONTHS[mon.getMonth()] + '\n');
    if (W) {
      put('Focus', W.focus); put('How I wanted to feel', W.feel);
      putList('Weekly goals', W.goals); putList('Grateful for', W.grat);
      if (W.todos && W.todos.length) out.push('**To do**\n' + W.todos.map(t => '- [' + (t.d ? 'x' : ' ') + '] ' + t.t).join('\n') + '\n');
      put('Notes', W.notes); putList('Top three wins', W.wins);
      if (W.rate) put('Week rated', W.rate + '/10');
    }
    if (days.length) out.push('**Days**\n' + days.join('\n') + '\n');
  }

  out.push('\n## Monthly reviews\n');
  MONTHS.forEach((mo, i) => {
    const M = S.months[monthKey(YEAR, i)];
    if (!M) return;
    const any = (M.review && Object.values(M.review).some(x => x && String(x).trim())) ||
      M.goals.some(g => g.t) || (M.am || []).some(x => x) || (M.pm || []).some(x => x);
    if (!any) return;
    out.push('\n### ' + mo + '\n');
    M.goals.forEach((g, n) => { if (g.t) { put('Goal ' + (n + 1), g.t); putList('Focus', g.focus); put('Notes', g.notes); } });
    putList('Morning rituals', M.am); putList('Evening rituals', M.pm);
    MONTH_REVIEW.forEach(f => f.ty === 'list' ? putList(f.l, (M.review || {})[f.k]) : put(f.l, (M.review || {})[f.k]));
  });

  out.push('\n## Mid-year review\n');
  MID_YEAR.forEach(f => put(f.l, (S.f.mid || {})[f.k]));
  out.push('\n## Yearly review\n');
  YEAR_REVIEW.forEach(f => f.ty === 'list' ? putList(f.l, (S.f.yr || {})[f.k]) : put(f.l, (S.f.yr || {})[f.k]));

  out.push('\n## Habits\n');
  S.habits.forEach(h => {
    const days = Object.keys(S.hlog).filter(d => S.hlog[d].includes(h.id)).sort();
    out.push('- **' + (h.name || 'Habit') + '** — ' + days.length + ' days logged, current streak ' + streak(h.id));
  });

  const pdays = Object.keys(S.limbs.days).sort();
  if (pdays.length) {
    out.push('\n## Practice — the eight limbs\n');
    out.push('Logged on ' + pdays.length + ' days. Current unbroken run: ' + limbStreak() + '.\n');
    LIMBS.forEach(l => {
      let up = 0, slip = 0;
      pdays.forEach(k => { const st = limbState(l, S.limbs.days[k].marks || {}); if (st === 'up') up++; else if (st === 'slip') slip++; });
      out.push('- **' + l.sanskrit + '** (' + l.english + ') — upheld ' + up + ', slipped ' + slip);
    });
    out.push('');
    pdays.forEach(k => {
      const e = S.limbs.days[k];
      const notes = Object.entries(e.notes || {}).filter(([, v]) => (v.text || '').trim());
      if (!notes.length) return;
      out.push('\n### ' + k + '\n');
      notes.forEach(([pid, v]) => {
        const pr = PBYID[pid];
        out.push('**' + (pr ? pr.name : pid) + '** (' + (v.t === 'slip' ? 'slipped' : 'upheld') + ')  \n' + v.text.trim() + '\n');
      });
    });
  }

  if (S.studio.entries.length) {
    out.push('\n' + exegesisMarkdown().replace(/^# /, '## '));
  }

  if (S.lists.length) {
    out.push('\n## MiLists\n');
    S.lists.forEach(l => {
      out.push('\n### ' + (l.title || 'List') + '\n');
      l.items.forEach(it => out.push('- [' + (it.d ? 'x' : ' ') + '] ' + it.t));
    });
  }
  const srcs = allSources();
  if (srcs.length) {
    out.push('\n## Sources\n');
    srcs.forEach(s2 => out.push('- ' + (s2.l.url ? '[' + (s2.l.label || s2.l.url) + '](' + s2.l.url + ')' : s2.l.label) +
      (s2.ctx ? ' _(' + s2.where.toLowerCase() + ': ' + s2.ctx + ')_' : '') + (s2.l.note ? ' — ' + s2.l.note : '')));
  }

  if (S.notes.length) {
    out.push('\n## Notes\n');
    S.notes.forEach(n => { out.push('\n### ' + (n.title || 'Note') + '\n'); out.push((n.body || '').trim() + '\n'); });
  }
  return out.join('\n');
}

function limbDay(k) { return (S.limbs.days[k] = S.limbs.days[k] || { marks: {}, notes: {} }); }
function limbState(limb, marks) {
  let up = false, slip = false;
  limb.practices.forEach(p => { if (marks[p.id] === 'up') up = true; if (marks[p.id] === 'slip') slip = true; });
  return up ? 'up' : (slip ? 'slip' : 'none');
}
function setMark(k, pid, type) {
  const e = limbDay(k);
  if (e.marks[pid] === type) { delete e.marks[pid]; reflecting = null; }
  else { e.marks[pid] = type; reflecting = pid; }
  save(); render();
}
function limbStreak() {
  let n = 0, d = new Date();
  const has = dd => Object.keys((S.limbs.days[iso(dd)] || {}).marks || {}).length > 0;
  if (!has(d)) d = addDays(d, -1);
  while (has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function limbsEngaged(k) {
  const marks = (S.limbs.days[k] || {}).marks || {};
  return LIMBS.filter(l => limbState(l, marks) !== 'none').length;
}

/* the eight-band spectrum for one day */

}

function compressImage(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 900, sc = Math.min(1, MAX / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => res(null);
      img.src = r.result;
    };
    r.onerror = () => res(null);
    r.readAsDataURL(file);
  });
}

function exegesisMarkdown() {
  const L = [], p = S.studio.project;
  L.push('# ' + (p.title || 'Untitled project') + ' — exegesis draft\n');
  L.push('_Generated ' + iso(new Date()) + ' from ' + S.studio.entries.length + ' documented sessions._\n');
  if (p.questions) L.push('## Research questions\n\n' + p.questions + '\n');

  L.push('## Methodology\n');
  L.push('This research was conducted through a reflective practice methodology, documenting studio sessions and reflecting on them in three temporal modes — reflection in action (observations made during the work itself), reflection on action (retrospective sense-making after each session), and reflection for action (anticipatory intentions carried into subsequent sessions). This structure follows the account of the creative reflective practitioner developed by Linda Candy, building on Donald Schön\'s foundational work on reflective practice. Sessions were documented in text and photographs at the time of making, so that in-the-moment discovery can be traced separately from later interpretation.\n');
  L.push('[Expand: your specific documentation methods, the relationship between artefact and text in this project, and cite Candy (e.g. *The Creative Reflective Practitioner*, 2019) and Schön (*The Reflective Practitioner*, 1983) in your required referencing style.]\n');

  const themes = themeCounts();
  if (themes.length) {
    L.push('## Thematic threads\n');
    themes.forEach(([t, n]) => L.push('- **' + t + '** — ' + n + ' session' + (n === 1 ? '' : 's')));
    L.push('');
  }

  L.push('## Session record\n');
  S.studio.entries.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(e => {
    L.push('\n### ' + e.date + ' — ' + (e.title || 'Untitled session') + '\n');
    if (e.goal) {
      const g = S.goals.find(x => x.id === e.goal);
      if (g) L.push('_Toward: ' + (g.title || 'a goal') + '_\n');
    }
    if (e.did) L.push('**What I did**  \n' + e.did + '\n');
    MODES.forEach(m => { if ((e[m.id] || '').trim()) L.push('**' + m.label + '**  \n' + e[m.id] + '\n'); });
    if ((e.media || []).length) L.push('_' + e.media.length + ' plate' + (e.media.length === 1 ? '' : 's') + ' documented._\n');
    if ((e.links || []).length) {
      L.push('**Sources**');
      e.links.forEach(l => L.push('- ' + (l.url ? '[' + (l.label || l.url) + '](' + l.url + ')' : l.label) + (l.note ? ' — ' + l.note : '')));
      L.push('');
    }
    if ((e.themes || []).length) L.push('Themes: ' + e.themes.join(', ') + '\n');
  });

  const cited = allSources();
  if (cited.length) {
    L.push('\n## Sources referenced\n');
    cited.forEach(s2 => L.push('- ' + (s2.l.url ? '[' + (s2.l.label || s2.l.url) + '](' + s2.l.url + ')' : s2.l.label) +
      (s2.ctx ? ' — ' + s2.where.toLowerCase() + ': ' + s2.ctx : '') + (s2.l.note ? '. ' + s2.l.note : '')));
    L.push('\n[Reformat into your required referencing style.]\n');
  }

  const practiceDays = Object.keys(S.limbs.days).length;
  if (practiceDays) {
    L.push('\n## Practice context\n');
    L.push('Over the same period, contemplative practice was logged on ' + practiceDays + ' days across the eight limbs.\n');
  }
  return L.join('\n');
}


/* ===================== syncing across devices ===================== */
/* A private gist is the shared copy. No server, no account beyond the one
   already hosting this file. The token lives only in this browser. */

const GIST_FILE = 'goal-digger-2026.json';
let syncing = false, lastSync = '';

function gistHeaders() {
  return {
    'Authorization': 'Bearer ' + (S.cfg.token || '').trim(),
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}

/* what actually gets uploaded — photos optionally stay home */
function payloadForCloud() {
  const c = JSON.parse(JSON.stringify(S));
  delete c.cfg.token;
  if (!S.cfg.cloudPhotos) {
    (c.studio.entries || []).forEach(e => { e.media = []; e.mediaHeld = true; });
  }
  return JSON.stringify(c);
}

async function cloudPush() {
  if (!S.cfg.token) { toast('Add a token first'); return false; }
  syncing = true;
  try {
    const body = JSON.stringify({
      description: 'Goal Digger ' + YEAR + ' — planner data',
      public: false,
      files: { [GIST_FILE]: { content: payloadForCloud() } }
    });
    let res;
    if (S.cfg.gist) {
      res = await fetch('https://api.github.com/gists/' + S.cfg.gist, { method: 'PATCH', headers: gistHeaders(), body });
    } else {
      res = await fetch('https://api.github.com/gists', { method: 'POST', headers: gistHeaders(), body });
    }
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const data = await res.json();
    S.cfg.gist = data.id;
    lastSync = new Date().toISOString();
    S.meta.lastPush = lastSync;
    dirty = false;
    save(true);
    toast('Sent to the cloud copy');
    return true;
  } catch (e) {
    toast('Push failed: ' + e.message);
    return false;
  } finally { syncing = false; }
}

async function cloudFetch() {
  if (!S.cfg.token || !S.cfg.gist) return null;
  const res = await fetch('https://api.github.com/gists/' + S.cfg.gist, { headers: gistHeaders() });
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  const data = await res.json();
  const f = (data.files || {})[GIST_FILE];
  if (!f) throw new Error('no data file in that gist');
  let text = f.content;
  if (f.truncated && f.raw_url) text = await (await fetch(f.raw_url)).text();
  return JSON.parse(text);
}

async function cloudPull(mode) {
  if (!S.cfg.gist) { toast('No cloud copy yet'); return false; }
  syncing = true;
  try {
    const remote = await cloudFetch();
    if (!remote) throw new Error('nothing there');
    S = mode === 'replace' ? Object.assign(DEFAULT(), remote, { cfg: S.cfg })
                           : mergeState(remote, S);
    lastSync = new Date().toISOString();
    save(true);
    toast(mode === 'replace' ? 'Replaced with the cloud copy' : 'Merged');
    return true;
  } catch (e) {
    toast('Pull failed: ' + e.message);
    return false;
  } finally { syncing = false; }
}

/* ---- merging two copies, record by record ---- */
function mergeById(local, remote, remoteNewer, keepMedia) {
  const map = new Map((local || []).map(x => [x.id, x]));
  (remote || []).forEach(r => {
    const mine = map.get(r.id);
    if (!mine) { map.set(r.id, r); return; }
    if (!remoteNewer) return;
    if (keepMedia && (!r.media || !r.media.length) && (mine.media || []).length) r.media = mine.media;
    map.set(r.id, r);
  });
  return Array.from(map.values());
}
function mergeKeyed(local, remote, remoteNewer) {
  const out = Object.assign({}, local || {});
  Object.entries(remote || {}).forEach(([k, v]) => {
    if (out[k] === undefined || remoteNewer) out[k] = v;
  });
  return out;
}

function mergeState(remote, local) {
  const rt = (remote.meta || {}).updated || '', lt = (local.meta || {}).updated || '';
  const rn = rt > lt;                       // whose prose wins on a genuine clash
  const out = JSON.parse(JSON.stringify(local));

  out.days = mergeKeyed(local.days, remote.days, rn);
  out.weeks = mergeKeyed(local.weeks, remote.weeks, rn);
  out.months = mergeKeyed(local.months, remote.months, rn);
  out.hlog = mergeKeyed(local.hlog, remote.hlog, rn);
  out.limbs = { days: mergeKeyed((local.limbs || {}).days, (remote.limbs || {}).days, rn) };

  out.goals = mergeById(local.goals, remote.goals, rn);
  out.lists = mergeById(local.lists, remote.lists, rn);
  out.notes = mergeById(local.notes, remote.notes, rn);
  out.dump = mergeById(local.dump, remote.dump, rn);
  out.habits = mergeById(local.habits, remote.habits, rn);
  out.links = mergeById(local.links, remote.links, rn);
  out.studio = {
    project: rn && (remote.studio || {}).project && remote.studio.project.title
      ? remote.studio.project : (local.studio || {}).project,
    entries: mergeById((local.studio || {}).entries, (remote.studio || {}).entries, rn, true)
  };

  /* long-form prose: fill gaps either way, newer side wins a real collision */
  out.f = rn ? Object.assign({}, local.f, remote.f) : Object.assign({}, remote.f, local.f);
  ['mid', 'yr', 'life', 'sav'].forEach(k => {
    if (!remote.f || !remote.f[k]) return;
    out.f[k] = rn ? Object.assign({}, (local.f || {})[k], remote.f[k])
                  : Object.assign({}, remote.f[k], (local.f || {})[k]);
  });

  out.agenda = rn ? (remote.agenda || local.agenda) : local.agenda;
  out.cfg = local.cfg;                      // device settings stay put
  out.meta = { updated: new Date().toISOString(), device: S.cfg.device || '' };
  return out;
}
